<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CELLRUNNER</title>
<meta name="description" content="Run the edges of a living Voronoi mesh. Click to dash. No install.">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 29,10 26,26 8,28 3,12' fill='%233b6ee0'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0d14;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  /* Fixed-width slots with tabular digits, so a change in one reading never shifts the others. */
  #hud {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    gap: 1.2em;
    font-size: 18px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    opacity: 0.8;
    pointer-events: none;
  }
  #hud span { white-space: nowrap; text-align: left; }
  #hud-score { min-width: 9ch; }
  #hud-next { min-width: 8ch; }
  #hud-best { min-width: 8ch; }
  #hud.hidden { display: none; }
  @media (max-width: 480px) {
    #hud { font-size: 14px; gap: 0.8em; }
  }

  /* Overlays (start, game over): a translucent, blurred sheet over the live field. Top-aligned
     with generous padding so the stack never jumps when a child grows; overflow hidden so a
     short viewport trims the description rather than scrolling. */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: max(48px, env(safe-area-inset-top) + 24px) 16px
             max(24px, env(safe-area-inset-bottom) + 12px);
    overflow: hidden;
    background: rgba(11, 13, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.35s;
    text-align: center;
  }
  .overlay > * { flex-shrink: 0; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  /* The game-over sheet is more transparent so the board behind it stays readable. */
  #gameover, #paused {
    background: rgba(11, 13, 20, 0.4);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  #paused { justify-content: center; padding-top: 0; }
  /* Icon buttons (mute, pause): lower right during play, outside #hud so they take clicks. */
  #icons {
    position: fixed;
    bottom: calc(12px + env(safe-area-inset-bottom));
    right: calc(12px + env(safe-area-inset-right));
    display: flex;
    gap: 8px;
  }
  #icons.hidden { display: none; }
  #start-continue { margin-top: 14px; }
  #start-continue.hidden { display: none; }
  .start-link { margin-top: 28px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .start-link a { color: rgba(255, 255, 255, 0.4); text-decoration: none; }
  .start-link a:hover { color: rgba(255, 255, 255, 0.85); }
  #icons-left {
    position: fixed;
    bottom: calc(12px + env(safe-area-inset-bottom));
    left: calc(12px + env(safe-area-inset-left));
    display: flex;
    gap: 8px;
  }
  #icons-left.hidden { display: none; }
  /* The fullscreen button shows one of two glyphs by its `fs` class. Its glyphs are strokes. */
  #fs-btn svg { fill: none; }
  #fs-btn .exit, #fs-btn.fs .enter { display: none; }
  #fs-btn.fs .exit { display: block; }
  .icon-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 8px;
    background: rgba(11, 13, 20, 0.35);
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .icon-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.4); }
  .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .icon-btn.hidden { display: none; }
  /* The mute button shows one of two glyphs by its `muted` class. */
  #mute-btn .off, #mute-btn.muted .on { display: none; }
  #mute-btn.muted .off { display: block; }
  h1 {
    font-size: clamp(32px, 10vw, 56px); /* ten letters must fit a phone width */
    font-weight: 750;
    letter-spacing: 0.06em;
    margin: 0;
    background: linear-gradient(115deg, #8cbeff, #d6a94a, #4debbf);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tag {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }
  .label {
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.55);
  }
  .big {
    font-size: 48px;
    font-weight: 700;
    line-height: 1.1;
    color: #fff;
  }
  button {
    margin-top: 22px;
    padding: 12px 40px;
    border: none;
    border-radius: 999px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #0b0d14;
    background: linear-gradient(115deg, #8cbeff, #4debbf);
    cursor: pointer;
    touch-action: manipulation;
  }
  button.quiet {
    margin-top: 12px;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  button:hover { filter: brightness(1.1); }
  .keys {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
  }
  @media (pointer: coarse) { .keys { display: none; } }
  /* The intro: three illustrated panels (route, dash, enemies) that wrap into a column on a
     phone. The drawings reuse the game's colours and shapes so they teach what will be seen. */
  .intro {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px 28px;
    margin-top: 32px;
    max-width: 640px;
  }
  .intro figure {
    flex: 1 1 170px;
    max-width: 200px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .intro svg { width: 96px; height: 96px; overflow: visible; }
  .intro figcaption {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.7);
  }
  .intro b { color: rgba(255, 255, 255, 0.95); font-weight: 600; }
  @media (max-width: 480px) {
    .intro { gap: 14px 16px; margin-top: 24px; }
    .intro figure { flex-basis: 140px; }
    .intro svg { width: 72px; height: 72px; }
    .intro figcaption { font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="hud" class="hidden">
  <span id="hud-score"></span><span id="hud-next"></span><span id="hud-best"></span>
</div>

<div id="start" class="overlay">
  <h1>CELLRUNNER</h1>
  <div class="tag">start or space to play</div>
  <div id="start-best" class="label">&nbsp;</div>
  <button id="start-btn">START</button>
  <button id="start-continue" class="quiet hidden">CONTINUE LAST RUN</button>
  <div class="intro">
    <figure>
      <svg viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke-linecap="round"
        stroke-linejoin="round">
        <g stroke="rgba(255,255,255,0.22)" stroke-width="1.2">
          <path d="M4 30 L30 18 L58 26 L62 54 L36 70 L10 58 Z"/>
          <path d="M30 18 L40 2 M58 26 L84 12 L92 40 L62 54 M36 70 L44 94 M10 58 L2 72 M62 54 L92 64"/>
        </g>
        <path d="M10 58 L36 70 L62 54 L92 40" stroke="#8cbeff" stroke-width="3.5"
          stroke-dasharray="0 0" opacity="0.95"/>
        <circle cx="92" cy="40" r="6" fill="#d6a94a"/>
        <circle cx="92" cy="40" r="11" stroke="#d6a94a" stroke-width="1.5" opacity="0.5"/>
        <circle cx="10" cy="58" r="5" fill="#ffffff"/>
      </svg>
      <figcaption>You run the edges toward the <b>gold marker</b>. The route is chosen for you
        and redrawn as the mesh shifts.</figcaption>
    </figure>
    <figure>
      <svg viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke-linecap="round">
        <path d="M6 70 L90 70" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
        <path d="M14 66 Q48 10 82 66" stroke="#5adcff" stroke-width="2.5" stroke-dasharray="5 6"
          opacity="0.85"/>
        <circle cx="14" cy="66" r="4" fill="rgba(255,255,255,0.35)"/>
        <circle cx="48" cy="38" r="13" stroke="#5adcff" stroke-width="2.5" opacity="0.9"/>
        <circle cx="48" cy="38" r="6" fill="#ffffff"/>
        <circle cx="48" cy="70" r="4" fill="rgba(0,0,0,0.5)"/>
        <path d="M66 70 L84 70 M78 64 L86 70 L78 76" stroke="#d6a94a" stroke-width="2"/>
      </svg>
      <figcaption><b>Click to dash</b>: airborne, fast, untouchable. The marker backs away and
        pays half. Click again in the air to <b>stomp</b> the enemy under you.</figcaption>
    </figure>
    <figure>
      <svg viewBox="0 0 96 96" aria-hidden="true" fill="none">
        <path d="M4 48 L92 48 M30 48 L22 90 M66 48 L78 6" stroke="rgba(255,255,255,0.22)"
          stroke-width="1.2"/>
        <circle cx="22" cy="48" r="7" fill="#ff7340"/>
        <circle cx="30" cy="48" r="3.5" fill="#ff7340"/>
        <circle cx="12" cy="45" r="2.5" fill="#ff7340" opacity="0.6"/>
        <circle cx="6" cy="51" r="2" fill="#ff7340" opacity="0.4"/>
        <circle cx="58" cy="48" r="8" stroke="#c7ff4d" stroke-width="3.5"/>
        <circle cx="61" cy="48" r="3" fill="#c7ff4d"/>
        <circle cx="76" cy="26" r="6" fill="#f259cc"/>
        <circle cx="86" cy="19" r="2.5" fill="#f259cc"/>
      </svg>
      <figcaption><b>Enemies</b> run the edges too; touch one and the run ends. New kinds join
        as you score.</figcaption>
    </figure>
  </div>
  <div class="start-link"><a href="https://github.com/wistrand/cellrunner" target="_blank"
    rel="noopener">source on GitHub</a></div>
</div>

<div id="icons-left" class="hidden">
  <button id="fs-btn" class="icon-btn" aria-label="Fullscreen" title="Fullscreen (F)">
    <svg class="enter" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
    <svg class="exit" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round"><path d="M6 2v4H2M10 6V2M10 6h4M14 10h-4v4M2 10h4v4"/></svg>
  </button>
</div>

<div id="icons" class="hidden">
  <button id="mute-btn" class="icon-btn" aria-label="Mute" title="Mute (M)">
    <svg class="on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/>
      <path d="M11 5.5a3 3 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <svg class="off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/>
      <path d="M10.5 6l4 4M14.5 6l-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <button id="pause-btn" class="icon-btn" aria-label="Pause" title="Pause (P)">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/>
      <rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
  </button>
</div>

<div id="paused" class="overlay hidden">
  <div class="tag">paused</div>
  <div class="keys">P, space or click to resume</div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="tag">caught</div>
  <div id="over-score" class="big">0</div>
  <div id="over-line" class="label">0 goals · best 0</div>
  <button id="restart-btn">RESTART</button>
  <button id="continue-btn" class="quiet">CONTINUE</button>
  <div class="keys">R restart · C or space continue · click restart</div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
